<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create character — CharacterForge</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><a class="brand" href="/app">⚔ CharacterForge</a><div class="topbar-actions"><span id="identity" class="muted"></span><button id="logout" class="btn" type="button">Sign out</button></div></header><main class="shell" aria-labelledby="title"><p><a id="back-link" href="/app">← Back</a></p><p class="eyebrow" id="kind-label">Character builder</p><h1 id="title">Create character</h1><p class="lede">Build from CharacterForge's canonical SRD catalog. Derived HP, AC, proficiency, saves, features, skills, and equipment are calculated by the server.</p><div id="status" class="status" role="status" aria-live="polite"></div><form id="character-form" class="card"><div class="form-grid"><div><label for="name">Name</label><input id="name" name="name" type="text" maxlength="200"></div><div><label for="level">Level</label><input id="level" name="level" type="number" min="1" max="30" value="1" required></div><div><label for="race">Race</label><select id="race" name="race" required></select></div><div><label for="char-class">Class</label><select id="char-class" name="char_class" required></select></div><div><label for="background">Background</label><select id="background" name="background" required></select></div><div><label for="alignment">Alignment</label><select id="alignment" name="alignment" required></select></div></div><fieldset><legend>Ability scores</legend><div class="ability-grid"><label>Strength<input name="strength" type="number" min="1" max="30" value="10" required></label><label>Dexterity<input name="dexterity" type="number" min="1" max="30" value="10" required></label><label>Constitution<input name="constitution" type="number" min="1" max="30" value="10" required></label><label>Intelligence<input name="intelligence" type="number" min="1" max="30" value="10" required></label><label>Wisdom<input name="wisdom" type="number" min="1" max="30" value="10" required></label><label>Charisma<input name="charisma" type="number" min="1" max="30" value="10" required></label></div></fieldset><details><summary>Optional overrides and roleplay notes</summary><div class="form-grid details-grid"><div><label for="speed">Speed</label><input id="speed" name="speed" type="number" min="0" value="30"></div><div><label for="hp-override">HP override</label><input id="hp-override" name="hp_override" type="number" min="1"></div><div><label for="ac-override">AC override</label><input id="ac-override" name="armor_class_override" type="number" min="0"></div></div><label for="personality">Personality trait</label><textarea id="personality" name="personality_trait" rows="2"></textarea><label for="ideal">Ideal</label><textarea id="ideal" name="ideal" rows="2"></textarea><label for="bond">Bond</label><textarea id="bond" name="bond" rows="2"></textarea><label for="flaw">Flaw</label><textarea id="flaw" name="flaw" rows="2"></textarea><label for="notes">Notes</label><textarea id="notes" name="notes" rows="4"></textarea></details><button class="btn primary" type="submit">Create character</button></form></main><script type="module" src="/assets/character-new.js"></script></body></html>
