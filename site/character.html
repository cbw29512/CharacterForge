<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character — CharacterForge</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><a class="brand" href="/app">⚔ CharacterForge</a><div class="topbar-actions"><span id="identity" class="muted"></span><a class="btn" href="/templates">Templates</a><button id="logout" class="btn" type="button">Sign out</button></div></header><main class="shell" aria-labelledby="character-name"><p><a id="back-link" href="/app">← Back</a></p><div id="status" class="status" role="status" aria-live="polite"></div><section class="card"><p class="eyebrow" id="kind">Character</p><div class="section-head"><div><h1 id="character-name">Loading character…</h1><p id="identity-line" class="lede"></p></div><button id="delete-character" class="btn danger" type="button" hidden>Delete</button></div><div id="core-stats" class="stat-grid"></div></section><section id="save-template-section" class="card" hidden aria-labelledby="save-template-title"><h2 id="save-template-title">Save as reusable template</h2><form id="save-template-form"><label for="template-name">Template name</label><input id="template-name" name="name" type="text" maxlength="200" required><label for="template-description">Description</label><textarea id="template-description" name="description" rows="3"></textarea><button class="btn primary" type="submit">Save template</button></form></section><div class="two-column"><section class="card"><h2>Ability scores</h2><dl id="abilities" class="definition-grid"></dl></section><section class="card"><h2>Combat</h2><dl id="combat" class="definition-grid"></dl></section></div><div class="two-column"><section class="card"><h2>Skills & saves</h2><div><h3>Skills</h3><ul id="skills"></ul></div><div><h3>Saving throws</h3><ul id="saves"></ul></div></section><section class="card"><h2>Equipment & features</h2><div><h3>Equipment</h3><ul id="equipment"></ul></div><div><h3>Features</h3><ul id="features"></ul></div></section></div><section class="card"><h2>Traits & notes</h2><dl id="traits" class="definition-grid"></dl><p id="notes" class="pre-wrap"></p></section></main><script type="module" src="/assets/character.js"></script></body></html>
