<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First-time setup — CharacterForge</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="shell auth-shell" aria-labelledby="title"><a class="brand" href="/">⚔ CharacterForge</a><section class="card"><h1 id="title">Create the first admin</h1><p>This page is only available before CharacterForge has an administrator.</p><div id="status" class="status" role="status" aria-live="polite"></div><form id="setup-form"><label for="display-name">Display name</label><input id="display-name" name="display_name" autocomplete="name" maxlength="120"><label for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="80" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="password-help"><p id="password-help" class="muted">At least 12 characters.</p><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" required><button class="btn primary" type="submit">Create administrator</button></form><p class="muted"><a href="/login">Back to sign in</a></p></section></main><script type="module" src="/assets/setup.js"></script></body></html>
