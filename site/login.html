<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — CharacterForge</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="shell auth-shell" aria-labelledby="title"><a class="brand" href="/">⚔ CharacterForge</a><section class="card"><h1 id="title">Sign in</h1><p>Use your existing CharacterForge account.</p><div id="status" class="status" role="status" aria-live="polite"></div><form id="login-form"><fieldset><legend>Account role</legend><div class="role-grid"><label><input type="radio" name="role" value="player" checked> Player</label><label><input type="radio" name="role" value="dm"> Dungeon Master</label><label><input type="radio" name="role" value="admin"> Admin</label></div></fieldset><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="80"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="btn primary" type="submit">Enter CharacterForge</button></form><p class="muted">New installation? <a href="/setup">Create the first admin</a>.</p></section></main><script type="module" src="/assets/login.js"></script></body></html>
