name: CharacterForge Netlify Frontend

on:
  pull_request:
    paths:
      - 'site/**'
      - 'netlify.toml'
      - 'tests/test_netlify_frontend_contract.py'
      - '.github/workflows/netlify-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'netlify.toml'
      - 'tests/test_netlify_frontend_contract.py'
      - '.github/workflows/netlify-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static frontend security contract
        run: python -m unittest tests.test_netlify_frontend_contract -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install accessibility tooling
        run: npm install --no-save pa11y@10.0.0
      - name: Start static site
        run: |
          python -m http.server 4174 --directory site > /tmp/cf-static.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4174/login.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cf-static.log
          exit 1
      - name: WCAG audit static frontend
        run: |
          npx pa11y --config .pa11y.json http://127.0.0.1:4174/index.html
          npx pa11y --config .pa11y.json http://127.0.0.1:4174/login.html
          npx pa11y --config .pa11y.json http://127.0.0.1:4174/setup.html
          npx pa11y --config .pa11y.json http://127.0.0.1:4174/app.html
