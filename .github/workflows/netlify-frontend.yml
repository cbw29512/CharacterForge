name: CharacterForge Netlify Frontend

on:
  pull_request:
    paths:
      - 'site/**'
      - 'netlify.toml'
      - 'package.json'
      - 'scripts/write_netlify_build_info.mjs'
      - 'scripts/netlify_build_info_contract.test.mjs'
      - 'tests/test_netlify_frontend_contract.py'
      - '.github/workflows/netlify-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'netlify.toml'
      - 'package.json'
      - 'scripts/write_netlify_build_info.mjs'
      - 'scripts/netlify_build_info_contract.test.mjs'
      - 'tests/test_netlify_frontend_contract.py'
      - '.github/workflows/netlify-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static frontend security contract
        run: python -m unittest tests.test_netlify_frontend_contract -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify build provenance contract
        run: node --test scripts/netlify_build_info_contract.test.mjs
      - name: Generate exact CI build metadata
        run: COMMIT_REF="$GITHUB_SHA" BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" CONTEXT="ci" npm run build:netlify
      - name: Install accessibility tooling
        run: npm install --no-save pa11y@10.0.0
      - name: Start static site
        run: |
          python -m http.server 4174 --directory site > /tmp/cf-static.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4174/login.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cf-static.log
          exit 1
      - name: Verify served build provenance
        run: |
          node -e "fetch('http://127.0.0.1:4174/build-info.json').then(r=>r.json()).then(v=>{if(v.commit!==process.env.GITHUB_SHA||v.context!=='ci')process.exit(1);console.log(v)})"
      - name: WCAG audit static frontend
        run: |
          npx pa11y --config .pa11y.json http://127.0.0.1:4174/index.html
          npx pa11y --config .pa11y.json http://127.0.0.1:4174/login.html
          npx pa11y --config .pa11y.json http://127.0.0.1:4174/setup.html
          npx pa11y --config .pa11y.json http://127.0.0.1:4174/app.html
          npx pa11y --config .pa11y.json 'http://127.0.0.1:4174/campaign.html?id=1'
          npx pa11y --config .pa11y.json 'http://127.0.0.1:4174/character.html?id=1'
          npx pa11y --config .pa11y.json 'http://127.0.0.1:4174/character-new.html?campaign_id=1'
          npx pa11y --config .pa11y.json http://127.0.0.1:4174/templates.html
