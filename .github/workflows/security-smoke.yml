name: CharacterForge Security Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: characterforge-ci-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: sqlite:////tmp/characterforge-ci.sqlite3
      FLASK_PORT: '5050'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install browser accessibility tooling
        run: npm install --no-save pa11y@8.0.0

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run security configuration regression tests
        run: python -m unittest discover -s tests -v

      - name: Start isolated CharacterForge server
        run: |
          rm -f /tmp/characterforge-ci.sqlite3
          python app.py > /tmp/characterforge-ci.log 2>&1 &
          echo $! > /tmp/characterforge-ci.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5050/auth/setup >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/characterforge-ci.log
          exit 1

      - name: WCAG audit first-launch setup
        run: npx pa11y --config .pa11y.json http://127.0.0.1:5050/auth/setup

      - name: Seed isolated admin for login audit
        run: |
          python - <<'PY'
          from app import create_app
          from db import db
          from models import User
          from services.auth_service import hash_password

          app = create_app()
          with app.app_context():
              if User.query.filter_by(role="admin").count() == 0:
                  db.session.add(User(
                      username="ciadmin",
                      display_name="CI Admin",
                      role="admin",
                      password_hash=hash_password("CharacterForge-CI-Password-123!"),
                  ))
                  db.session.commit()
          PY

      - name: WCAG audit login
        run: npx pa11y --config .pa11y.json http://127.0.0.1:5050/auth/login

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/characterforge-ci.log || true
