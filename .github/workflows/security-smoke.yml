name: CharacterForge Security Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        env:
          SECRET_KEY: characterforge-ci-compile-secret-0123456789
        run: python -m compileall -q .

      - name: Run security configuration regression tests
        run: python -m unittest discover -s tests -v
