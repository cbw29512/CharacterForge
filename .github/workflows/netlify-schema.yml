name: CharacterForge Netlify Schema

on:
  pull_request:
    paths:
      - 'package.json'
      - 'shared/**'
      - 'services/srd_service.py'
      - 'routes/characters.py'
      - 'routes/templates.py'
      - 'netlify/database/migrations/**'
      - 'netlify/functions/**'
      - 'netlify/lib/**'
      - 'scripts/netlify_db_contract.test.mjs'
      - 'scripts/netlify_health_contract.test.mjs'
      - 'scripts/netlify_auth_contract.test.mjs'
      - 'scripts/netlify_auth_endpoints.test.mjs'
      - 'scripts/netlify_guard_contract.test.mjs'
      - 'scripts/netlify_campaigns_contract.test.mjs'
      - 'scripts/netlify_campaign_view_contract.test.mjs'
      - 'scripts/netlify_campaign_owner_contract.test.mjs'
      - 'scripts/netlify_characters_contract.test.mjs'
      - 'scripts/netlify_character_frontend_contract.test.mjs'
      - 'scripts/netlify_srd_contract.test.mjs'
      - 'scripts/netlify_character_create_contract.test.mjs'
      - 'scripts/netlify_templates_contract.test.mjs'
      - 'scripts/netlify_admin_contract.test.mjs'
      - 'tests/test_netlify_schema_contract.py'
      - 'tests/test_shared_srd_parity.py'
      - 'tests/test_character_srd_validation.py'
      - 'tests/test_template_authorization.py'
      - '.github/workflows/netlify-schema.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'shared/**'
      - 'services/srd_service.py'
      - 'routes/characters.py'
      - 'routes/templates.py'
      - 'netlify/database/migrations/**'
      - 'netlify/functions/**'
      - 'netlify/lib/**'
      - 'scripts/netlify_db_contract.test.mjs'
      - 'scripts/netlify_health_contract.test.mjs'
      - 'scripts/netlify_auth_contract.test.mjs'
      - 'scripts/netlify_auth_endpoints.test.mjs'
      - 'scripts/netlify_guard_contract.test.mjs'
      - 'scripts/netlify_campaigns_contract.test.mjs'
      - 'scripts/netlify_campaign_view_contract.test.mjs'
      - 'scripts/netlify_campaign_owner_contract.test.mjs'
      - 'scripts/netlify_characters_contract.test.mjs'
      - 'scripts/netlify_character_frontend_contract.test.mjs'
      - 'scripts/netlify_srd_contract.test.mjs'
      - 'scripts/netlify_character_create_contract.test.mjs'
      - 'scripts/netlify_templates_contract.test.mjs'
      - 'scripts/netlify_admin_contract.test.mjs'
      - 'tests/test_netlify_schema_contract.py'
      - 'tests/test_shared_srd_parity.py'
      - 'tests/test_character_srd_validation.py'
      - 'tests/test_template_authorization.py'
      - '.github/workflows/netlify-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static schema contract
        run: python -m unittest tests.test_netlify_schema_contract -v

      - name: Shared SRD parity with Flask source
        run: python -m unittest tests.test_shared_srd_parity -v

      - name: Flask character SRD validation contract
        run: python -m unittest tests.test_character_srd_validation -v

      - name: Flask template authorization contract
        run: python -m unittest tests.test_template_authorization -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned Netlify runtime and database test dependencies
        run: npm install --no-save @netlify/database@2.0.0 @netlify/functions@6.0.0 @netlify/database-dev@1.0.1 pg@8.23.0 bcrypt@6.0.0

      - name: Apply migration to local Netlify Postgres and exercise constraints
        run: node --test scripts/netlify_db_contract.test.mjs

      - name: Exercise read-only health function against local Netlify Postgres
        run: node --test scripts/netlify_health_contract.test.mjs

      - name: Exercise auth primitives and durable session contract
        run: node --test scripts/netlify_auth_contract.test.mjs

      - name: Exercise bootstrap, login, session, and logout lifecycle
        run: node --test scripts/netlify_auth_endpoints.test.mjs

      - name: Exercise reusable role and CSRF guards
        run: node --test scripts/netlify_guard_contract.test.mjs

      - name: Exercise protected campaign lifecycle contract
        run: node --test scripts/netlify_campaigns_contract.test.mjs

      - name: Exercise protected campaign view contract
        run: node --test scripts/netlify_campaign_view_contract.test.mjs

      - name: Exercise campaign owner membership immutability
        run: node --test scripts/netlify_campaign_owner_contract.test.mjs

      - name: Exercise protected character read/delete contract
        run: node --test scripts/netlify_characters_contract.test.mjs

      - name: Exercise character frontend API dependencies
        run: node --test scripts/netlify_character_frontend_contract.test.mjs

      - name: Exercise Netlify SRD catalog and math contract
        run: node --test scripts/netlify_srd_contract.test.mjs

      - name: Exercise SRD-validated character creation contract
        run: node --test scripts/netlify_character_create_contract.test.mjs

      - name: Exercise template ownership and lifecycle contract
        run: node --test scripts/netlify_templates_contract.test.mjs

      - name: Exercise admin user-management lifecycle contract
        run: node --test scripts/netlify_admin_contract.test.mjs
